version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:8.0
    container_name: lifesync-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lifesync
    volumes:
      - mongodb_data:/data/db
    networks:
      - lifesync-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifesync-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lifesync?authSource=admin
      FRONTEND_URL: http://localhost:5174
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lifesync-network
    volumes:
      - ./src:/app/src
      - /app/node_modules

volumes:
  mongodb_data:
    driver: local

networks:
  lifesync-network:
    driver: bridge
